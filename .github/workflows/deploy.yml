name: Deploy react
on:
  push:
    branches:
      - master
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      - run: docker build -t abdalrhman1/react-test -f Dockerfile.dev .
      - run: docker run -e CI=true abdalrhman1/react-test npm run test

      - run: docker build -t abdalrhman1/multi-client -f ./client/Dockerfile ./microservices/client
      - run: docker build -t abdalrhman1/multi-nginx -f ./nginx/Dockerfile ./microservices/nginx
      - run: docker build -t abdalrhman1/multi-server -f ./server/Dockerfile ./microservices/server
      - run: docker build -t abdalrhman1/multi-worker -f ./worker/Dockerfile ./microservices/worker
      - run: docker push abdalrhman1/multi-client
      - run: docker push abdalrhman1/multi-nginx
      - run: docker push abdalrhman1/multi-server
      - run: docker push abdalrhman1/multi-worker
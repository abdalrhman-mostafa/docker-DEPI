name: Deploy react
on:
  push:
    branches:
      - master
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - run: docker login -u ${{ secrets.DOCKER_USERNAME }} - ${{ secrets.DOCKER_PASSWORD }}
      - run: docker build -t abdalrhman1/react-test -f Dockerfile.dev .
      - run: docker run -e CI=true abdalrhman1/docker-react npm run test
